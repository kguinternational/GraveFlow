version: '3.8'

services:
  brain-engine:
    build: 
      context: .
      dockerfile: Dockerfile
    command: node server.js
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=production
    volumes:
      - ./.brain:/app/.brain
      - ./aggregated_chats.md:/app/aggregated_chats.md
    restart: unless-stopped

  c-suite-ai:
    build: 
      context: .
      dockerfile: Dockerfile
    command: node csuite.js
    ports:
      - "8003:8003"
    environment:
      - NODE_ENV=production
    volumes:
      - ./.brain:/app/.brain
    restart: unless-stopped
