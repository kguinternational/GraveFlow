services:
  - type: web
    name: graveflow-api
    env: node
    plan: free
    buildCommand: npm run build:render
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: graveflow-db
          property: connectionString
      - key: NODE_VERSION
        value: 20
      # Add production env vars here later in Render Dashboard:
      # - STRIPE_SECRET_KEY
      # - PINATA_JWT
      # - GEMINI_API_KEY
      # - ESCROW_PRIVATE_KEY
      # - NEXT_PUBLIC_SUPABASE_URL (if applicable)

databases:
  - name: graveflow-db
    databaseName: graveflow
    user: graveflow
    plan: free
